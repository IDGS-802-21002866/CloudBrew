{% extends 'layout.html' %}

{% block content %}
<div class="min-h-screen bg-white p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-4xl font-bold mb-6">Dashboard</h1>
    
    <div class="bg-gray-100 rounded-lg p-8">
      <p class="text-lg text-gray-700 mb-4">
        Estás en el dashboard de CloudBrew.
      </p>
      <p class="text-gray-600 mb-6">
        Aquí irán los componentes principales de tu aplicación.
      </p>
      
      <div class="space-y-4">
        <a href="{{ url_for('main.index') }}" class="inline-block px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
          Volver al Inicio
        </a>
        <a href="{{ url_for('auth.logout') }}" class="inline-block px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition ml-4">
          Cerrar Sesión
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
