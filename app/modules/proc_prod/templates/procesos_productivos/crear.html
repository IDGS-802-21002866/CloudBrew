{% extends 'base.html' %}
{% from '_macros.html' import campo_nuevo %}

{% block content %}
<div class="p-6 max-w-3xl mx-auto">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('proc_prod.listar') }}"
       class="text-gray-500 hover:text-gray-800 text-xl font-bold">
      <i class="fa-solid fa-chevron-left"></i>
    </a>
    <h2 class="text-2xl font-bold text-gray-800">
      {% if proceso %}Editar{% else %}Crear{% endif %} Proceso Productivo
    </h2>
  </div>

<form action="{% if proceso %}{{ url_for('proc_prod.editar', id=proceso.id) }}{% else %}{{ url_for('proc_prod.crear') }}{% endif %}" method="POST" class="max-w-3xl mx-auto mt-10 bg-white border border-gray-200 rounded-2xl shadow-sm">
  {{ form.hidden_tag() }}
  <div class="bg-gray-100 px-0 py-0 border-b border-gray-200">
    <span class="font-bold text-gray-700 block p-4"><i class="fa-solid fa-circle-info mr-2"></i> Datos del Proceso</span>
  </div>

  <div class="p-8">
    <div class="grid grid-cols-1 gap-5">
      <!-- Nombre -->
      {{ campo_nuevo(form.nombre) }}

      <!-- Descripción -->
      {{ campo_nuevo(form.descripcion) }}
    </div>

    <div class="pt-4 flex gap-2 items-center">
      <button type="submit"
        class="flex-1 text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">
        {% if proceso %}Actualizar{% else %}Crear{% endif %}
      </button>
      <a href="{{ url_for('proc_prod.listar') }}"
        class="flex-1 text-white bg-gray-400 hover:bg-gray-500 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
        Cancelar
      </a>
    </div>
  </div>
</form>
</div>
{% endblock %}
