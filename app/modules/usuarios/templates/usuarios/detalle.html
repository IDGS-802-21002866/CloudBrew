{% extends "base.html" %}

{% block content %}

<div class="max-w-3xl mx-auto py-8 px-4">

  <a href="{{ url_for('usuarios.listar') }}" class="flex items-center text-2xl font-bold mb-6 hover:text-gray-600 transition">
    <i class="fa-solid fa-chevron-left mr-3"></i> Detalle del Usuario
  </a>

  <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
    <div class="bg-gray-100 px-6 py-4 border-b border-gray-200">
      <span class="font-bold text-gray-700"><i class="fa-solid fa-circle-info mr-2"></i> Datos del Usuario</span>
    </div>

    <div class="p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
        <div>
          <label class="block text-gray-500 text-sm font-bold uppercase">Nombre</label>
          <p class="text-xl font-bold text-gray-800">{{ usuario.nombre }}</p>
        </div>
        <div>
          <label class="block text-gray-500 text-sm font-bold uppercase">Email</label>
          <p class="text-lg text-gray-700">{{ usuario.email }}</p>
        </div>
        <div>
          <label class="block text-gray-500 text-sm font-bold uppercase">Rol</label>
          <p class="text-lg text-gray-700">{{ usuario.rol.name }}</p>
        </div>
        <div>
          <label class="block text-gray-500 text-sm font-bold uppercase">Estado</label>
          <p class="text-lg font-bold {{ 'text-[#4A9062]' if usuario.activo else 'text-[#B85B5B]' }}">
            {{ 'Activo' if usuario.activo else 'Inactivo' }}
          </p>
        </div>
        <div>
          <label class="block text-gray-500 text-sm font-bold uppercase">Agregado por:</label>
          <p class="text-lg text-gray-700">{{ usuario.actualizado_por }}</p>
        </div>
      </div>

      <div class="flex justify-end space-x-4 border-t pt-6">
        <a href="{{ url_for('usuarios.editar', id=usuario.id) }}" class="px-6 py-2 bg-[#6C9AD0] text-white font-bold rounded-lg shadow-md hover:opacity-90 transition">
          Modificar
        </a>
        <form method="POST" action="{{ url_for('usuarios.eliminar', id=usuario.id) }}" onsubmit="return confirm('¿Estás seguro de que deseas eliminar este usuario?');">
          <button type="submit" class="px-6 py-2 bg-[#B85B5B] text-white font-bold rounded-lg shadow-md hover:opacity-90 transition">
            <i class="fa-solid fa-trash mr-2"></i> Eliminar
          </button>
        </form>
      </div>
    </div>
  </div>

</div>

{% endblock %}
