{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white shadow-md rounded-lg p-8 border border-gray-400">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Nueva Solicitud de Compra</h1>
        
        <form method="POST">
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">Materia Prima</label>
                {% if materia %}
                    <input type="hidden" name="materia_prima_id" value="{{ materia.id }}">
                    <input type="text" value="{{ materia.nombre }}" class="w-full p-2 border-2 border-gray-400 rounded-lg bg-gray-50" readonly>
                {% else %}
                    <select name="materia_prima_id" class="w-full p-2 border-2 border-gray-400 rounded-lg focus:border-[#6C9AD0] outline-none" required>
                        <option value="">-- Selecciona una materia --</option>
                        {% for m in materias %}
                            <option value="{{ m.id }}">{{ m.nombre }}</option>
                        {% endfor %}
                    </select>
                {% endif %}
            </div>

            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">Cantidad Necesaria</label>
                <input type="number" name="cantidad" step="0.01" class="w-full p-2 border-2 border-gray-400 rounded-lg focus:border-[#6C9AD0] outline-none" placeholder="0.00" required>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">Motivo de la solicitud</label>
                <textarea name="motivo" class="w-full p-2 border-2 border-gray-400 rounded-lg focus:border-[#6C9AD0] outline-none" rows="3" placeholder="Ej: Stock crítico para fin de semana..."></textarea>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-gray-100">
                <a href="{{ url_for('inventario_materias_primas.listar') }}" class="px-4 py-2 text-gray-500 font-bold hover:text-gray-700 transition">Cancelar</a>
                <button type="submit" class="bg-[#4A9062] text-white font-bold py-2 px-8 rounded shadow-md hover:opacity-90 transition">
                    Enviar a Compras
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
