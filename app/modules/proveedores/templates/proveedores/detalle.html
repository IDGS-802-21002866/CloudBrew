{% extends 'base.html' %}

{% block content %}
<div class="p-6 max-w-3xl mx-auto">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('proveedores.listar') }}"
       class="text-gray-500 hover:text-gray-800 text-xl font-bold">
      <i class="fa-solid fa-chevron-left"></i>
    </a>
    <h2 class="text-2xl font-bold text-gray-800">{{ proveedor.nombre }}</h2>
  </div>

  <div class="bg-white border border-gray-200 rounded-2xl shadow-sm">
    <div class="bg-gray-100 px-0 py-0 border-b border-gray-200">
      <span class="font-bold text-gray-700 block p-4"><i class="fa-solid fa-circle-info mr-2"></i> Detalles del Proveedor</span>
    </div>

    <div class="p-8 space-y-4">
      <div>
        <label class="text-sm font-medium text-gray-700">Teléfono</label>
        <p class="text-gray-900 font-medium">{{ proveedor.telefono or 'No registrado' }}</p>
      </div>
      <div>
        <label class="text-sm font-medium text-gray-700">Email</label>
        <p class="text-gray-900 font-medium">{{ proveedor.email or 'No registrado' }}</p>
      </div>
      <div>
        <label class="text-sm font-medium text-gray-700">Dirección</label>
        <p class="text-gray-900 font-medium">{{ proveedor.direccion or 'No registrada' }}</p>
      </div>
    </div>

    <div class="bg-gray-50 border-t border-gray-200 px-8 py-4 flex gap-2">
      <a href="{{ url_for('proveedores.editar', id=proveedor.id) }}"
        class="text-white bg-amber-500 hover:bg-amber-600 focus:ring-4 focus:ring-amber-300 font-medium rounded-lg text-sm px-5 py-2.5">
        <i class="fa-solid fa-edit mr-2"></i> Editar
      </a>
      <form method="POST" action="{{ url_for('proveedores.eliminar', id=proveedor.id) }}">
        <button type="submit"
          class="text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5"
          onclick="return confirm('¿Estás seguro?')">
          <i class="fa-solid fa-trash mr-2"></i> Eliminar
        </button>
      </form>
      <a href="{{ url_for('proveedores.listar') }}"
        class="text-white bg-gray-400 hover:bg-gray-500 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 ml-auto">
        <i class="fa-solid fa-arrow-left mr-2"></i> Volver
      </a>
    </div>
  </div>
</div>
{% endblock %}
